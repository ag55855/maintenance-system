<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حالة الصيانة - مركز صيانة احمد شيتوس</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .status-card { max-width: 500px; width: 100%; border: none; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .status-badge { font-size: 0.9rem; padding: 6px 16px; border-radius: 20px; }
        .progress-bar-custom { height: 10px; border-radius: 5px; }
    </style>
</head>
<body class="p-3">

<div class="card status-card p-4 bg-white">
    <!-- الهيدر -->
    <div class="text-center border-bottom pb-3 mb-3">
        <h4 class="fw-bold text-primary mb-1"><i class="fa-solid fa-microchip me-2"></i>مركز صيانة احمد شيتوس</h4>
        <p class="text-muted small m-0">استعلام عن حالة صيانة جهازك</p>
    </div>

    <!-- شاشة التحميل -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">جاري جلب تفاصيل الصيانة...</p>
    </div>

    <!-- شاشة الخطأ / غير موجود -->
    <div id="errorState" class="text-center py-4 d-none">
        <i class="fa-solid fa-triangle-exclamation text-warning fs-1 mb-3"></i>
        <h5 class="fw-bold text-danger mb-2">تعذر العثور على الجهاز</h5>
        <p class="text-muted small">يرجى التأكد من مسح الـ QR الخاص بالإيصال أو التواصل مع المركز مباشرة.</p>
    </div>

    <!-- محتوى حالة الطلب -->
    <div id="ticketContent" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-secondary" id="displayCode">#ORD</span>
            <span class="badge text-white status-badge" id="statusBadge">--</span>
        </div>

        <div class="border rounded p-3 mb-3 bg-light">
            <div class="row g-2 small">
                <div class="col-6"><strong>اسم العميل:</strong> <span id="custName"></span></div>
                <div class="col-6"><strong>نوع الجهاز:</strong> <span id="devType"></span></div>
                <div class="col-12 mt-2"><strong>العطل المذكور:</strong> <span id="problem"></span></div>
            </div>
        </div>

        <!-- شريط التقدم التفاعلي -->
        <div class="mb-4">
            <label class="form-label small fw-bold mb-1 d-flex justify-content-between">
                <span>تقدم عملية الصيانة</span>
                <span id="progressText" class="text-primary fw-bold">0%</span>
            </label>
            <div class="progress progress-bar-custom bg-secondary bg-opacity-10">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <!-- معلومات التكلفة والوقت المتوقع -->
        <div class="row text-center g-2 mb-3">
            <div class="col-6">
                <div class="border rounded p-2 bg-light">
                    <small class="text-muted d-block">الوقت المتوقع</small>
                    <span class="fw-bold text-dark" id="estHours">-- ساعة</span>
                </div>
            </div>
            <div class="col-6">
                <div class="border rounded p-2 bg-light">
                    <small class="text-muted d-block">التكلفة الإجمالية</small>
                    <span class="fw-bold text-success" id="totalCost">0 ج.م</span>
                </div>
            </div>
        </div>

        <!-- ملاحظات الفني إن وجدت -->
        <div id="techNotesContainer" class="alert alert-info py-2 px-3 small d-none mb-3">
            <strong><i class="fa-solid fa-comment-dots me-1"></i> ملاحظات الفني:</strong>
            <div id="techNotes" class="mt-1 text-dark"></div>
        </div>

        <!-- زر تحديث الشاشة -->
        <button onclick="fetchStatus()" class="btn btn-outline-primary w-100 fw-bold btn-sm">
            <i class="fa-solid fa-rotate me-1"></i> تحديث الحالة
        </button>
    </div>
</div>

<script>
    // استخراج رقم الطلب من الـ URL
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order');

    async function fetchStatus() {
        if (!orderId) {
            showError();
            return;
        }

        try {
            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('ticketContent').classList.add('d-none');
            document.getElementById('errorState').classList.add('d-none');

            const res = await fetch(`/api/tickets/${orderId}`);
            if (!res.ok) throw new Error();

            const data = await res.json();
            if (!data || !data.id) {
                showError();
                return;
            }

            renderTicketDetails(data);
        } catch (err) {
            showError();
        } finally {
            document.getElementById('loading').classList.add('d-none');
        }
    }

    function renderTicketDetails(ticket) {
        document.getElementById('displayCode').innerText = ticket.orderCode || `#ORD-${ticket.id}`;
        document.getElementById('custName').innerText = ticket.customerName;
        document.getElementById('devType').innerText = ticket.deviceType;
        document.getElementById('problem').innerText = ticket.problem;
        document.getElementById('estHours').innerText = `${ticket.estimatedHours || 0} ساعات`;
        document.getElementById('totalCost').innerText = `${ticket.totalCost || 0} ج.م`;

        if (ticket.techNotes && ticket.techNotes.trim() !== '') {
            document.getElementById('techNotes').innerText = ticket.techNotes;
            document.getElementById('techNotesContainer').classList.remove('d-none');
        } else {
            document.getElementById('techNotesContainer').classList.add('d-none');
        }

        // إعداد حالة العطل وشريط التقدم
        const statusBadge = document.getElementById('statusBadge');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        let progress = 0;
        let badgeClass = 'bg-secondary';

        switch (ticket.status) {
            case 'قيد الانتظار':
                progress = 25;
                badgeClass = 'bg-warning text-dark';
                break;
            case 'جاري الصيانة':
                progress = 60;
                badgeClass = 'bg-primary';
                break;
            case 'جاهز للتسليم':
                progress = 90;
                badgeClass = 'bg-info text-dark';
                break;
            case 'تم التسليم':
                progress = 100;
                badgeClass = 'bg-success';
                break;
            case 'رفض':
                progress = 100;
                badgeClass = 'bg-danger';
                break;
            default:
                progress = 10;
                badgeClass = 'bg-secondary';
        }

        statusBadge.className = `badge text-white status-badge ${badgeClass}`;
        statusBadge.innerText = ticket.status || 'قيد الانتظار';

        progressBar.style.width = `${progress}%`;
        progressText.innerText = `${progress}%`;
        if (ticket.status === 'رفض') {
            progressBar.className = 'progress-bar bg-danger';
        } else if (ticket.status === 'تم التسليم') {
            progressBar.className = 'progress-bar bg-success';
        } else {
            progressBar.className = 'progress-bar progress-bar-striped progress-bar-animated bg-primary';
        }

        document.getElementById('ticketContent').classList.remove('d-none');
    }

    function showError() {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('ticketContent').classList.add('d-none');
        document.getElementById('errorState').classList.remove('d-none');
    }

    // جلب البيانات فور تحميل الصفحة
    document.addEventListener("DOMContentLoaded", fetchStatus);
</script>
</body>
</html>
