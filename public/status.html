<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع حالة الصيانة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        .status-card { max-width: 500px; margin: 40px auto; border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .status-badge { font-size: 1.1rem; padding: 8px 16px; border-radius: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card status-card p-4">
        <div class="text-center mb-4 border-bottom pb-3">
            <h4 class="fw-bold text-primary m-0"><i class="fa-solid fa-microchip me-2"></i>مركز صيانة احمد شيتوس</h4>
            <p class="text-muted small mb-0">حالة طلب الصيانة الخاص بك</p>
        </div>

        <div id="loading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">جاري جلب بيانات الطلب...</p>
        </div>

        <div id="errorMessage" class="alert alert-danger text-center d-none"></div>

        <div id="statusContent" class="d-none">
            <div class="text-center mb-4">
                <span id="statusBadge" class="badge bg-primary status-badge"></span>
            </div>

            <div class="bg-light p-3 rounded mb-3">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">رقم الطلب:</span>
                    <strong id="orderCode" class="text-primary"></strong>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">اسم العميل:</span>
                    <strong id="custName"></strong>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">نوع الجهاز:</span>
                    <strong id="devType"></strong>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">تاريخ الاستلام:</span>
                    <strong id="createdDate"></strong>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted">الوقت المقدر:</span>
                    <strong id="estHours"></strong>
                </div>
            </div>

            <div id="notesContainer" class="alert alert-info d-none mb-3">
                <strong>ملاحظات الفني:</strong>
                <p id="techNotes" class="mb-0 mt-1"></p>
            </div>

            <div class="border-top pt-3 text-center text-muted small">
                شكرًا لتعاملكم مع مركز صيانة احمد شيتوس
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        // قراءة البرامتر سواء كان order أو id
        const orderId = urlParams.get('order') || urlParams.get('id');

        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('errorMessage');
        const contentDiv = document.getElementById('statusContent');

        if (!orderId) {
            loadingDiv.classList.add('d-none');
            errorDiv.classList.remove('d-none');
            errorDiv.innerText = 'رقم الطلب غير صحيح أو غير موجود بالرابط!';
            return;
        }

        try {
            const res = await fetch(`/api/tickets/${orderId}`);
            if (!res.ok) {
                throw new Error('عفواً، لم يتم العثور على جهاز بهذا الرقم.');
            }
            const ticket = await res.json();

            loadingDiv.classList.add('d-none');
            contentDiv.classList.remove('d-none');

            document.getElementById('orderCode').innerText = ticket.orderCode || `#ORD-${ticket.id}`;
            document.getElementById('custName').innerText = ticket.customerName;
            document.getElementById('devType').innerText = ticket.deviceType;
            document.getElementById('createdDate').innerText = new Date(ticket.createdAt).toLocaleString('ar-EG');
            document.getElementById('estHours').innerText = `${ticket.estimatedHours} ساعة`;

            // تحديث شارة الحالة والتنسيق
            const badge = document.getElementById('statusBadge');
            badge.innerText = ticket.status;
            
            if (ticket.status === 'جاهز للتسليم' || ticket.status === 'تم التسليم') {
                badge.className = 'badge bg-success status-badge';
            } else if (ticket.status === 'جاري الصيانة') {
                badge.className = 'badge bg-warning text-dark status-badge';
            } else if (ticket.status === 'رفض' || ticket.status === 'إنهاء واختفاء') {
                badge.className = 'badge bg-danger status-badge';
            } else {
                badge.className = 'badge bg-secondary status-badge';
            }

            if (ticket.techNotes) {
                document.getElementById('notesContainer').classList.remove('d-none');
                document.getElementById('techNotes').innerText = ticket.techNotes;
            }

        } catch (err) {
            loadingDiv.classList.add('d-none');
            errorDiv.classList.remove('d-none');
            errorDiv.innerText = err.message;
        }
    });
</script>
</body>
</html>
